name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q parseforge
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Doctor
        run: python -m parseforge.doctor
      - name: Bench
        run: python -m parseforge.cli bench --config configs/default.yaml
